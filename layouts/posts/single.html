{{ define "main" }}
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <p class="post-meta">{{ .Date.Format "Jan 2, 2006" }}{{ with .Params.author }} • {{ . }}{{ end }}{{ with .Params.meta }} • {{ . }}{{ end }}</p>
  </header>

  <article class="post-content">
    {{ .Content }}
  </article>

</div>
{{ end }}
