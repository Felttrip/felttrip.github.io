<footer class="site-footer">

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col  footer-col-1">
        <ul class="contact-list">
          <li>{{ .Site.Title }}</li>
          <li><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></li>
        </ul>
      </div>

      <div class="footer-col  footer-col-2">
            <a href="https://github.com/{{ .Site.Params.github_username }}">
                <i class="fa fa-github-square fa-2x"></i>
            </a>
            <a href="https://www.linkedin.com/in/{{ .Site.Params.linkedin_username }}">
                <i class="fa fa-linkedin-square fa-2x"></i>
            </a>
            <a href="/feed.xml">
                <i class="fa fa-rss-square fa-2x"></i>
            </a>
      </div>

      <div class="footer-col  footer-col-3">
        <p class="text">
            {{ .Site.Params.description }}<br>
            <i class="fa fa-btc"></i><a href="bitcoin:{{ .Site.Params.bitcoin }}?label=A%20Day%20In%20The%20Woods">{{ .Site.Params.bitcoin }}</a>
        </p>

      </div>
    </div>

  </div>

</footer>
