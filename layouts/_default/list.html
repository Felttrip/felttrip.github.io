{{ define "main" }}
<div class="page">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
  </header>

  <article class="page-content">
    {{ .Content }}
    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <span class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</span>
          <a href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </article>
</div>
{{ end }}
