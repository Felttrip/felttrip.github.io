<!DOCTYPE html>
<html>

  {{ partial "head.html" . }}

  <body>

    {{ partial "header.html" . }}

    <div class="page-content">
      <div class="wrapper">
        {{ block "main" . }}{{ end }}
      </div>
    </div>

    {{ partial "footer.html" . }}

    <script>
      document.querySelectorAll('img').forEach(img => img.loading = 'lazy');
    </script>

  </body>

</html>
